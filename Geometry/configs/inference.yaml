# Inference Configuration

# Data
caseName: berserker_s1
data_folder: /mnt/d/zjh/dataset/${caseName}/start
image_size: 128
num_workers: 4

# Model Paths
vae_model_path: pretrained_models/stable-diffusion-v1-5/vae
vae_finetune_path: /mnt/d/zjh/weights/${caseName}/vae.pt
pretrained_model_path: pretrained_models/stable-diffusion-v1-5
motion_module_path: pretrained_models/motion_module.pth
checkpoint_path: /mnt/d/zjh/weights/${caseName}/diffusion

# Renormalization
use_renormalization: true
keypoint_y_coordinate: 38
keypoint_x_ranges:          # Uncomment to override default [(0, 96)]
  - [18, 30]
  - [65, 78]

# PCA Reconstruction (post-processing only, does not affect auto-regressive pipeline)
use_pca_reconstruction: true
pca_path: /mnt/d/zjh/dataset/${caseName}/PCA/pca_200.ckpt
pca_mask_path: /mnt/d/zjh/dataset/${caseName}/PCA/pca_mask.npy
sigma_pca: 10.0

# Output
output_dir: /mnt/d/zjh/test_results/opensource/${caseName}

# DDIM Sampling
pure_noise_timestep: 999
pure_noise_steps: 10
cfg_scale: 1.0

# Motion Sequence (compact format: each entry is expanded to count repetitions)
motion_sequence:
  - action: Forward
    count: 60
  - action: Backward
    count: 60
  - action: Left
    count: 60
  - action: Idle
    count: 20

max_test_samples: 100

# Precision
mixed_precision: "no"
enable_xformers_memory_efficient_attention: true

# Output Formats
save_meshes: true
save_exr: true
save_npy: true
threshold_factor: 0.05